stages:
  - lint
  - test
  - build
  - deploy

lint:
  stage: lint
  image: python:3.13
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - ruff check .
    - ruff format --check .

test:
  stage: test
  image: python:3.13
  services:
    - name: postgres:16
      alias: postgres
  variables: 
    POSTGRES_DB: app_test
    POSTGRES_USER: app_user
    POSTGRES_PASSWORD: app_pass
    TEST_DATABASE_URL: postgresql://app_user:app_pass@postgres:5432/app_test
  before_script:
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - pytest -v

build:
  stage: build
  image: docker:27.4.1-cli
  services:
    - name: docker:27.4.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

deploy:
  stage: deploy
  image: alpine:3.20
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
    - chmod 400 "$SSH_PRIVATE_KEY"
  script:
    - |
      set -e
      ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=devops-pet-vm -i "$SSH_PRIVATE_KEY" goha46@"$DEPLOY_HOST" \
        "mkdir -p /home/goha46/monitoring/grafana/alerting"
      scp -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=devops-pet-vm -i "$SSH_PRIVATE_KEY" \
        compose.deploy.yml goha46@"$DEPLOY_HOST":/home/goha46/compose.deploy.yml
      scp -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=devops-pet-vm -i "$SSH_PRIVATE_KEY" \
        monitoring/prometheus.yml goha46@"$DEPLOY_HOST":/home/goha46/monitoring/prometheus.yml
      scp -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=devops-pet-vm -i "$SSH_PRIVATE_KEY" \
        monitoring/grafana/alerting/api-health.yml monitoring/grafana/alerting/backup-health.yml goha46@"$DEPLOY_HOST":/home/goha46/monitoring/grafana/alerting/
      ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o HostKeyAlias=devops-pet-vm -i "$SSH_PRIVATE_KEY" goha46@"$DEPLOY_HOST" "
        set -e
        cd /home/goha46
        sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$CI_COMMIT_SHA/' .env
        for attempt in 1 2 3; do
          if sudo -n docker compose -f compose.deploy.yml pull app node-exporter; then
            break
          fi

          if [ \"\$attempt\" -eq 3 ]; then
            exit 1
          fi

          sleep 10
        done
        sudo -n docker compose -f compose.deploy.yml up -d --wait
        sudo -n docker compose -f compose.deploy.yml ps
      "
publish-docs:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp docs/oauth/*.html public/
  pages: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'