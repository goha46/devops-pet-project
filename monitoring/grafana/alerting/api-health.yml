apiVersion: 1
groups:
    - orgId: 1
      name: api-health
      folder: Dev Ops Pet
      interval: 1m
      rules:
        - uid: fg1u45e3153wgc
          title: API недоступен
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: cg1wo4ulc4kcgf
              model:
                editorMode: code
                expr: up{job="fastapi"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 1m
          annotations:
            summary: API недоступен или его метрика отсутствует более минуты
          isPaused: false
          notification_settings:
            receiver: Egor Ilin
