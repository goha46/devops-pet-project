services:
  app:
    build: .
    restart: always
    ports:
      - "80:8003"
    depends_on:
      - db
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
    command: mysqld
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
